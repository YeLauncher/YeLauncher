name: Build and Release

on:
  push:
    branches:
      - main # Triggers whenever code is pushed or merged into main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    outputs:
      app_version: ${{ steps.get_version.outputs.VERSION }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            extension: exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. VERSIONING: Extract version directly from pubspec.yaml
      - name: Extract App Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1 | tr -d '\r')
          echo "Detected version: v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 2. CACHE: Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          cache: true

      # 3. CACHE: Pub Dependencies
      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~\AppData\Local\Pub\Cache
            ~/AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-cache-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-cache-

      - name: Install Dependencies
        run: flutter pub get

      # 4. CACHE: Build Runner Outputs
      - name: Cache Build Runner
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ hashFiles('**/pubspec.lock') }}-

      - name: Run Code Generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env file
        run: |
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Create sentry.properties file
        run: |
          echo "auth.token=${{ secrets.SENTRY_AUTH_TOKEN }}" >> sentry.properties

      # 5. TEST: Run Dart/Flutter Tests
      - name: Run Tests
        run: flutter test

      # 6. BUILD: Standard Windows Executable
      - name: Build Windows App
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      # 7. PACKAGING: Create MSIX Package
      - name: Create MSIX Package
        if: matrix.platform == 'windows'
        run: dart run msix:create

      # 8. PACKAGING: Compile Inno Setup Installer
      - name: Create Inno Setup Installer
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # 9. ARTIFACTS: Rename and Upload to Actions Run
      - name: Rename Output Files
        shell: bash
        run: |
          cp Output/yelauncher-setup.exe yelauncher-windows-installer.exe
          # Finds the generated .msix and copies it to the dynamically generated naming format
          find . -name "*.msix" -type f -exec cp {} "YeLauncher.YeLauncher_${{ steps.get_version.outputs.VERSION }}_X64.msix" \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yelauncher-${{ matrix.platform }}
          path: |
            yelauncher-windows-installer.exe
            YeLauncher.YeLauncher_*_X64.msix

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Production Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.app_version }}"
          name: "Release v${{ needs.build.outputs.app_version }}"
          files: |
            yelauncher-windows-installer.exe
            YeLauncher.YeLauncher_${{ needs.build.outputs.app_version }}_X64.msix
          generate_release_notes: true

      # ---------------------------------------------------------
      # 10. PUBLISH: Microsoft Store (Native MSIX Upload)
      # ---------------------------------------------------------
      - name: Configure Microsoft Store CLI 
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials 
        run: msstore reconfigure ` 
              --tenantId ${{ secrets.TENANT_ID }} ` 
              --sellerId ${{ secrets.SELLER_ID }} ` 
              --clientId ${{ secrets.CLIENT_ID }} ` 
              --clientSecret ${{ secrets.CLIENT_SECRET }} 

      - name: Publish MSIX to Microsoft Store
        # The CLI parses your MSIX manifest and pushes the file directly to your submission
        run: msstore publish YeLauncher.YeLauncher_${{ needs.build.outputs.app_version }}_X64.msix --appId ${{ secrets.STORE_ID }}
